[pytest]
# Exclude test_groq.py from CI - it's a manual API verification script
# Ignore tmp directory and debug text files that cause collection errors
addopts = --ignore=test_groq.py --ignore=test_context.txt --ignore=tmp/

# Directories to avoid while searching for tests
norecursedirs = tmp .git backend/venv

# Only collect Python files as tests
python_files = test_*.py *_test.py

asyncio_mode = auto
