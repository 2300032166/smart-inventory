<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — SIRA Store</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../customer-style.css?v=999">
  <style>
    .order-card { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 16px; transition: box-shadow var(--transition); }
    .order-card:hover { box-shadow: var(--shadow-md); }
    .order-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--c-border); flex-wrap: wrap; gap: 10px; }
    .order-id { font-size: 13px; font-weight: 700; color: var(--c-primary); font-family: monospace; }
    .order-body { padding: 16px 20px; }
    .order-item-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--c-border); }
    .order-item-row:last-child { border-bottom: none; }
    .order-item-img { width: 50px; height: 50px; border-radius: var(--radius-sm); background: var(--c-bg); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; overflow: hidden; }
    .order-item-img img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
    .order-footer { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--c-bg); flex-wrap: wrap; gap: 10px; }
  </style>
</head>
<body>
<nav class="c-nav" id="c-nav"></nav>

<div class="c-page">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px">
    <div>
      <h1 style="font-size:24px;font-weight:800;letter-spacing:-0.02em">My Orders</h1>
      <div style="font-size:13px;color:var(--c-text-2);margin-top:2px" id="order-count">Loading…</div>
    </div>
    <a href="customer-catalog.html" class="c-btn c-btn-secondary c-btn-sm">+ New Order</a>
  </div>

  <div id="loading" class="c-spinner-wrap"><div class="c-spinner"></div></div>
  <div id="orders-list" style="display:none"></div>
  <div id="empty-orders" style="display:none">
    <div class="c-empty">
      <div class="c-empty-icon">📦</div>
      <div class="c-empty-title">No orders yet</div>
      <div class="c-empty-desc">Start shopping and your orders will appear here.</div>
      <a href="customer-catalog.html" class="c-btn c-btn-primary">Browse Products</a>
    </div>
  </div>
</div>

<script src="../js/customer-app.js?v=9"></script>
<script>
  cCheckAuth();
  cInjectNav();

  async function loadOrders() {
    try {
      const data = await cFetch('/customer-orders/orders');
      if (!data) return;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('order-count').textContent = `${data.length} order${data.length !== 1 ? 's' : ''}`;
      if (!data.length) { document.getElementById('empty-orders').style.display = 'flex'; return; }
      document.getElementById('orders-list').style.display = 'block';
      document.getElementById('orders-list').innerHTML = data.map(o => renderOrder(o)).join('');
    } catch (e) {
      document.getElementById('loading').style.display = 'none';
      cToast(e.message, 'error');
    }
  }

  function renderOrder(o) {
    const items = o.items || [];
    const pm = { cod: 'Cash on Delivery', upi: 'UPI', card: 'Credit/Debit Card' };
    return `
    <div class="order-card">
      <div class="order-header">
        <div>
          <div class="order-id">📦 ${o.order_id}</div>
          <div style="font-size:12px;color:var(--c-text-3);margin-top:2px">${cFmtDateTime(o.order_date)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span class="c-status ${o.status}">${o.status}</span>
          <span style="font-size:15px;font-weight:800;color:var(--c-primary)">${cFmtPrice(o.total_amount)}</span>
        </div>
      </div>
      <div class="order-body">
        ${items.map(it => `
          <div class="order-item-row">
            <div class="order-item-img">
              <img src="/assets/products/${it.sku}.jpg" onerror="this.style.display='none';this.parentNode.textContent='📦'" alt="${it.name}" loading="lazy">
            </div>
            <div style="flex:1">
              <div style="font-size:13px;font-weight:600">${it.name}</div>
              <div style="font-size:12px;color:var(--c-text-3)">Qty: ${it.quantity} × ${cFmtPrice(it.unit_price)}</div>
            </div>
            <div style="font-size:13px;font-weight:700;color:var(--c-primary)">${cFmtPrice(it.total)}</div>
          </div>`).join('')}
      </div>
      <div class="order-footer">
        <div style="font-size:12px;color:var(--c-text-2)">
          <span>📍 ${o.delivery_address?.slice(0,50)}${o.delivery_address?.length > 50 ? '…' : ''}</span>
          <span style="margin-left:14px">💳 ${pm[o.payment_method] || o.payment_method}</span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="c-btn c-btn-secondary c-btn-sm" onclick="printInvoice('${o.order_id}')">
            🧾 Invoice
          </button>
          <button class="c-btn c-btn-primary c-btn-sm" onclick="reorder('${o.order_id}')">
            🔄 Reorder
          </button>
        </div>
      </div>
    </div>`;
  }

  async function reorder(orderId) {
    try {
      const data = await cFetch(`/customer-orders/orders/${orderId}/reorder`, { method: 'POST' });
      if (!data) return;
      cToast(data.message, 'success');
      cUpdateCartBadge();
    } catch (e) { cToast(e.message, 'error'); }
  }

  async function printInvoice(orderId) {
    try {
      const data = await cFetch(`/customer-orders/orders/${orderId}`);
      if (!data) return;
      cPrintInvoice(data);
    } catch (e) { cToast(e.message, 'error'); }
  }

  loadOrders();
</script>
</body>
</html>
