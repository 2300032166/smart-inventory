<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Inventory Advisor</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
      </svg>
      Inventory Advisor
    </div>

    <h2 style="font-size:18px;font-weight:600;margin-bottom:6px;">Reset your password</h2>
    <p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:24px;">
      Enter your email and we'll send a reset link. In the sandbox, the token is logged to the console.
    </p>

    <div id="msg" class="alert-msg"></div>

    <form id="forgot-form">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@store.com" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="submit-btn">
        Send reset link
      </button>
    </form>

    <p style="text-align:center;margin-top:16px;font-size:13px;">
      <a href="login.html" style="color:var(--color-primary);text-decoration:none;">← Back to sign in</a>
    </p>
  </div>
</div>

<script>
  document.getElementById('forgot-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    btn.textContent = 'Sending…';

    try {
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value }),
      });
      const data = await res.json();
      msg.textContent = data.message;
      msg.className = 'alert-msg alert-msg-success show';
      if (data.debug_token) {
        console.log('[SANDBOX] Password reset token:', data.debug_token);
      }
    } catch {
      msg.textContent = 'Error sending reset email.';
      msg.className = 'alert-msg alert-msg-error show';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send reset link';
    }
  });
</script>
</body>
</html>
