<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Trends — Inventory Advisor</title>
  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="shell">
  <div id="topbar" class="topbar"></div>
  <div class="body-container">
    <nav id="sidebar" class="sidebar"></nav>
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="document.getElementById('sidebar').classList.remove('open');this.style.display='none'"></div>
    <main class="main-content">
      <div class="page-header">
        <div class="page-title">Sales Trends</div>
        <div class="page-subtitle">Analyse daily and weekly sales patterns by product</div>
      </div>

      <div class="card mb-24">
        <div class="filter-bar" style="margin-bottom:0;">
          <div class="form-group" style="margin-bottom:0;">
            <label for="sku-select" style="font-size:12px;">Product</label>
            <select id="sku-select" style="width:220px;"></select>
          </div>
          <div>
            <label style="font-size:12px;">Period</label>
            <div class="tab-bar" style="border:none;margin-bottom:0;">
              <button class="tab-btn active" data-days="7">7 days</button>
              <button class="tab-btn" data-days="30">30 days</button>
              <button class="tab-btn" data-days="90">90 days</button>
            </div>
          </div>
        </div>
      </div>

      <div id="summary-row" class="stat-cards" style="grid-template-columns:repeat(3,1fr);margin-bottom:24px;display:none;">
        <div class="stat-card"><div class="stat-label">Avg Daily Sales</div><div class="stat-value" id="s-avg">—</div></div>
        <div class="stat-card"><div class="stat-label">Peak Day</div><div class="stat-value" id="s-peak-day" style="font-size:18px;">—</div><div class="stat-sub" id="s-peak-qty"></div></div>
        <div class="stat-card"><div class="stat-label">Total This Period</div><div class="stat-value" id="s-total">—</div></div>
      </div>

      <div id="trends-spinner" class="spinner-wrap"><div class="spinner"></div></div>

      <div class="grid-2 mb-24" id="charts-area" style="display:none;">
        <div class="card"><div class="card-title mb-16">Daily Sales</div><div class="chart-container"><canvas id="line-chart"></canvas></div></div>
        <div class="card"><div class="card-title mb-16">Weekly Totals</div><div class="chart-container"><canvas id="bar-chart"></canvas></div></div>
      </div>

      <div class="card" id="patterns-card" style="display:none;">
        <div class="card-title mb-16">Detected Patterns</div>
        <div id="patterns-list"></div>
      </div>
    </main>
  </div>
</div>
<script src="../app.js"></script>
<script src="../js/trends.js"></script>
</body>
</html>
