<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Orders — Inventory Advisor</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="shell">
  <div id="topbar" class="topbar"></div>
  <div class="body-container">
    <nav id="sidebar" class="sidebar"></nav>
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="document.getElementById('sidebar').classList.remove('open');this.style.display='none'"></div>
    <main class="main-content">
      <div class="flex-between mb-24">
        <div class="page-header" style="margin-bottom:0;">
          <div class="page-title">Review Orders</div>
          <div class="page-subtitle" id="review-date"></div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
          <input type="date" id="date-picker" style="width:auto;height:36px;">
          <button class="btn btn-secondary" id="refresh-btn">↻ Refresh</button>
        </div>
      </div>

      <!-- Summary chips row -->
      <div id="summary-bar" class="mb-16"></div>

      <div id="msg" class="alert-msg"></div>
      <div id="review-spinner" class="spinner-wrap"><div class="spinner"></div></div>
      <div id="review-list"></div>
    </main>
  </div>
</div>
<script src="../app.js?v=3"></script>
<script src="../js/review.js?v=3"></script>
</body>
</html>
