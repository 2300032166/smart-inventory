<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Orders — Inventory Advisor</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="shell">
  <div id="topbar" class="topbar"></div>
  <div class="body-container">
    <nav id="sidebar" class="sidebar"></nav>
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="document.getElementById('sidebar').classList.remove('open');this.style.display='none'"></div>
    <main class="main-content">
      <div class="page-header">
        <div class="page-title">Review Orders</div>
        <div class="page-subtitle">Items awaiting your decision today · Shortcuts: <kbd style="background:#eee;padding:1px 5px;border-radius:3px;">A</kbd> Approve · <kbd style="background:#eee;padding:1px 5px;border-radius:3px;">S</kbd> Skip</div>
      </div>

      <div class="card mb-24">
        <div class="flex-between mb-8">
          <span class="card-title" id="progress-text">Loading…</span>
        </div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
      </div>

      <div id="msg" class="alert-msg"></div>
      <div id="review-spinner" class="spinner-wrap"><div class="spinner"></div></div>
      <div id="review-list"></div>
    </main>
  </div>
</div>
<script src="../app.js"></script>
<script src="../js/review.js"></script>
</body>
</html>
