<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers — Inventory Advisor</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="shell">
  <div id="topbar" class="topbar"></div>
  <div class="body-container">
    <nav id="sidebar" class="sidebar"></nav>
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="document.getElementById('sidebar').classList.remove('open');this.style.display='none'"></div>
    <main class="main-content">
      <div class="flex-between mb-16">
        <div>
          <div class="page-title">Suppliers</div>
          <div class="page-subtitle">Manage supplier contacts and lead times</div>
        </div>
        <button class="btn btn-primary" id="add-btn">+ Add supplier</button>
      </div>

      <div id="msg" class="alert-msg"></div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th><th>Contact</th><th>Phone</th><th>Email</th>
                <th>Default Lead Time</th><th>Delivery Schedule</th><th>Products</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="suppliers-tbody"></tbody>
          </table>
        </div>
        <div id="sup-spinner" class="spinner-wrap"><div class="spinner"></div></div>
      </div>
    </main>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="supplier-modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Add Supplier</div>
    <div id="modal-msg" class="alert-msg"></div>
    <form id="supplier-form">
      <div class="form-row">
        <div class="form-group"><label>Supplier ID *</label><input type="text" id="f-id" required></div>
        <div class="form-group"><label>Name *</label><input type="text" id="f-name" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Contact Person</label><input type="text" id="f-contact"></div>
        <div class="form-group"><label>Phone</label><input type="text" id="f-phone"></div>
      </div>
      <div class="form-group"><label>Email</label><input type="email" id="f-email"></div>
      <div class="form-row">
        <div class="form-group"><label>Default Lead Time (days)</label><input type="number" id="f-lead" min="1" value="7"></div>
        <div class="form-group"><label>Delivery Schedule</label><input type="text" id="f-schedule" placeholder="e.g. Mon and Thu"></div>
      </div>
      <div class="form-group"><label>Notes</label><textarea id="f-notes" rows="2"></textarea></div>
    </form>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('supplier-modal')">Cancel</button>
      <button class="btn btn-primary" id="save-btn">Save</button>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal-box">
    <div class="modal-title">Delete Supplier</div>
    <p style="font-size:13px;color:var(--color-text-secondary);">Are you sure you want to delete <strong id="delete-name"></strong>?</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('delete-modal')">Cancel</button>
      <button class="btn btn-danger" id="confirm-delete-btn">Delete</button>
    </div>
  </div>
</div>

<script src="../app.js"></script>
<script src="../js/suppliers.js"></script>
</body>
</html>
