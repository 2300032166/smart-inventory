<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Inventory Advisor</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
      </svg>
      Inventory Advisor
    </div>

    <h2 style="font-size:18px;font-weight:600;margin-bottom:6px;">Sign in to your account</h2>
    <p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:24px;">Enter your credentials to continue.</p>

    <div id="msg" class="alert-msg"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@store.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-with-icon">
          <input type="password" id="password" placeholder="Your password" required autocomplete="current-password">
          <button type="button" class="input-icon-btn" id="toggle-pw" title="Show/hide password">
            <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="submit-btn">
        Sign in
      </button>
    </form>

    <p style="text-align:center;margin-top:16px;font-size:13px;">
      <a href="forgot-password.html" style="color:var(--color-primary);text-decoration:none;">Forgot password?</a>
    </p>
  </div>
</div>

<script>
  if (localStorage.getItem('token')) {
    const role = localStorage.getItem('role');
    window.location.href = role === 'admin' ? 'admin-home.html' : 'dashboard.html';
  }

  document.getElementById('toggle-pw').addEventListener('click', function() {
    const pw = document.getElementById('password');
    const isText = pw.type === 'text';
    pw.type = isText ? 'password' : 'text';
    document.getElementById('eye-icon').innerHTML = isText
      ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
      : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  });

  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('msg');
    msg.className = 'alert-msg';
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      const res = await fetch('http://127.0.0.1:8001/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });

      if (!res.ok) {
        const err = await res.json();
        msg.textContent = err.detail || 'Invalid credentials.';
        msg.className = 'alert-msg alert-msg-error show';
        return;
      }

      const data = await res.json();
      localStorage.setItem('token', data.token);
      localStorage.setItem('role', data.role);
      localStorage.setItem('name', data.name);
      localStorage.setItem('user_id', data.user_id);

      window.location.href = data.role === 'admin' ? 'admin-home.html' : 'dashboard.html';
    } catch (err) {
      msg.textContent = 'Network error. Is the server running?';
      msg.className = 'alert-msg alert-msg-error show';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
